plugins { id 'com.android.application' }

android {
    namespace 'com.deadrecoil.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deadrecoil.game'
        minSdk 26
        targetSdk 35
        versionCode 60
        versionName '0.51.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
