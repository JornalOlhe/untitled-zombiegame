name: Publish Dead Recoil 0.37.0 (tag v42)
# v42: 0.37.0 — wave reliability, loadout navigation/UI, secret rigs, quality-aware horde caps and full regression gates. Final HEAD rebuild. Gate rebuild 3.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v42.yml']

concurrency:
  group: publish-v42
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ui-test:
    uses: ./.github/workflows/work-qa.yml
    permissions:
      contents: read

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            gradle assembleRelease --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
      - name: Package and verify Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/35.0.0"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --out dist/DeadRecoil.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
            cp dist/DeadRecoil.apk dist/DeadRecoil-v42.apk
            APK="dist/DeadRecoil.apk"
            echo "Stable release-signed APK prepared."
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/DeadRecoil-v42-manual.apk
            APK="dist/DeadRecoil-v42-manual.apk"
            echo "::warning::Signing secrets are missing. Publishing manual-install APK only; updater will not auto-install it."
          fi
          export ANDROID_APK="$APK"
          echo "ANDROID_APK=$APK" >> "$GITHUB_ENV"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          BADGING=$("$BT/aapt" dump badging "$ANDROID_APK")
          echo "$BADGING" | grep -q "package: name='com.deadrecoil.game'"
          echo "$BADGING" | grep -q "versionCode='42'"
          echo "$BADGING" | grep -q "versionName='0.37.0'"
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          apk = Path(os.environ["ANDROID_APK"])
          root = Path("android/app/src/main/assets")
          with zipfile.ZipFile(apk) as z:
              for file in root.rglob("*"):
                  if file.is_file():
                      name = "assets/" + file.relative_to(root).as_posix()
                      if z.read(name) != file.read_bytes():
                          raise SystemExit("Stale packaged asset: " + name)
          print("Android package contents verified.")
          PY
      # Boot gate failures are written as ::error annotations by the script (READY check fixed for pipefail; every adb call bounded by a timeout; READY read at :V).
      # Linux runner with KVM (hardware acceleration) — macOS arm64 runners cannot boot the
      # x86_64 emulator (v42 run 1: "Timeout waiting for emulator to boot").
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android real boot smoke
        id: boot
        # the emulator teardown sometimes hangs after the script passed: bound the step and let
        # the marker file written by the script decide
        timeout-minutes: 22
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/ci/android-boot-smoke.sh "$ANDROID_APK" 0.37.0 android-boot-v42.png
      - name: Require boot gate pass
        run: |
          test -f android-boot-ok.txt || { echo "::error::Android boot gate did not pass (step outcome: ${{ steps.boot.outcome }})"; exit 1; }
          cat android-boot-ok.txt
          test -f android-boot-v42.png || echo "::warning::no boot screenshot"
      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v42-Android
          path: |
            dist/*.apk
            android-boot-v42.png
          if-no-files-found: warn
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version
        shell: pwsh
        run: |
          $package = Get-Content desktop/package.json | ConvertFrom-Json
          if ($package.version -ne "0.37.0") { throw "Expected desktop 0.37.0" }
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Smoke test
        working-directory: desktop
        run: npm run smoke
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - name: Verify installer
        shell: pwsh
        run: |
          $exe = "desktop/dist/DeadRecoil-Setup-0.37.0.exe"
          if (!(Test-Path $exe)) { throw "Installer was not generated" }
          if ((Get-Item $exe).Length -lt 50000000) { throw "Installer is unexpectedly small" }
          $p = Start-Process $exe -ArgumentList "/S" -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed" }
          $installed = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Filter "Dead Recoil.exe" -Recurse -Depth 2 | Select-Object -First 1 -ExpandProperty FullName
          if (!$installed) { throw "Silent install did not produce Dead Recoil.exe" }
          $smoke = Start-Process $installed -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru -Wait
          if ($smoke.ExitCode -ne 0) { throw "Installed game failed smoke test" }
          Get-FileHash $exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v42-Windows
          path: desktop/dist/DeadRecoil-Setup-0.37.0.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [ui-test, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v42-Android
          path: android-artifact
      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v42-Windows
          path: windows-artifact
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find android-artifact -type f -name '*.apk' -exec cp {} dist/ \;
          find windows-artifact -type f -name '*.exe' -exec cp {} dist/ \;
          ls -lh dist
      - name: Publish GitHub release v42
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)"
          test -f dist/DeadRecoil-Setup-0.37.0.exe
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA" || {
            echo "Main changed during validation; rebuild the new HEAD before publishing."
            exit 1
          }
          if gh release view v42 >/dev/null 2>&1; then
            echo "Release v42 already exists; refusing to replace assets or move its tag."
            exit 1
          fi
          gh release create v42 dist/*.apk dist/DeadRecoil-Setup-0.37.0.exe \
            --target "$GITHUB_SHA" --title "Dead Recoil 0.37.0" --notes-file release/v42-notes.md --latest
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v42 --json tagName,name,isDraft,isPrerelease,assets
