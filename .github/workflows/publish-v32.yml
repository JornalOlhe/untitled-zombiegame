name: Publish Dead Recoil 0.30.1 (tag v32)
# 0.30.1: combat hitbox/balance hotfix and fully isolated Developer sandbox.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v32.yml']


concurrency:
  group: publish-v32
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast JavaScript syntax validation
        run: node tests/js-syntax.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-smoke.cjs
      - run: node tests/pursuit-smoke.cjs
      - run: node tests/movement-smoke.cjs
      - run: node tests/weapons-smoke.cjs
      - run: node tests/cyborg-smoke.cjs
      - run: node tests/secret-smoke.cjs
      - run: node tests/intro-smoke.cjs
      - run: node tests/projectiles-smoke.cjs
      - run: node tests/wall-smoke.cjs
      - run: node tests/stream-hitbox-smoke.cjs
      - run: node tests/dev-sandbox-smoke.cjs
      - run: node tests/melee-smoke.cjs
      - run: node tests/tp-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeadRecoil-v32-UI
          path: test-results/
          retention-days: 15

  monsters-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/monsters-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeadRecoil-v32-Monsters
          path: test-results/
          retention-days: 15

  deathkill-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/deathkill-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeadRecoil-v32-DeathKill
          path: test-results/
          retention-days: 15

  multiplayer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/multiplayer-local.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeadRecoil-v32-Multiplayer
          path: test-results/
          retention-days: 15

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Signed with the fixed release key (when the secrets exist) so every later version can
      # update this one in place from inside the game. Falls back to a debug build otherwise.
      - name: Build Android
        working-directory: android
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ]; then gradle assembleRelease --stacktrace; else gradle assembleDebug --stacktrace; fi

      - name: Sign and verify Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/35.0.0"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --out dist/DeadRecoil-v32.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
            echo "Signed with the release key."
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/DeadRecoil-v32.apk
            echo "::warning::Release signing secrets missing: published a debug-signed APK."
          fi
          "$BT/apksigner" verify --print-certs dist/DeadRecoil-v32.apk | head -5
          BADGING=$("$BT/aapt" dump badging dist/DeadRecoil-v32.apk)
          echo "$BADGING" | grep -q "package: name='com.deadrecoil.game'"
          echo "$BADGING" | grep -q "versionCode='31'"
          echo "$BADGING" | grep -q "versionName='0.30.1'"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          source = Path("android/app/src/main/assets/index.html").read_bytes()
          with zipfile.ZipFile("dist/DeadRecoil-v32.apk") as apk:
              packaged = apk.read("assets/index.html")
          if source != packaged:
              raise SystemExit("Packaged game assets do not match current main.")
          print("Android v32 verified.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v32-Android
          path: dist/DeadRecoil-v32.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate version
        shell: pwsh
        run: |
          $package = Get-Content desktop/package.json | ConvertFrom-Json
          if ($package.version -ne "0.30.1") { throw "Expected desktop 0.30.1" }

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Smoke test
        working-directory: desktop
        run: npm run smoke

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = "desktop/dist/DeadRecoil-Setup-0.30.1.exe"
          if (!(Test-Path $exe)) { throw "Installer was not generated" }
          if ((Get-Item $exe).Length -lt 50000000) { throw "Installer is unexpectedly small" }
          # Silent install + launch check, like the in-game updater does.
          $p = Start-Process $exe -ArgumentList "/S" -PassThru -Wait
          $installed = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Filter "Dead Recoil.exe" -Recurse -Depth 2 | Select-Object -First 1 -ExpandProperty FullName
          if (!$installed) { throw "Silent install did not produce Dead Recoil.exe" }
          Write-Host "Installed at $installed"
          $smoke = Start-Process $installed -ArgumentList "--smoke-test" -PassThru -Wait
          if ($smoke.ExitCode -ne 0) { throw "Installed game failed the smoke test" }
          Get-FileHash $exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v32-Windows
          path: desktop/dist/DeadRecoil-Setup-0.30.1.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [ui-test, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v32-Android
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v32-Windows
          path: dist

      - name: Publish GitHub release v32
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/DeadRecoil-v32.apk
          test -f dist/DeadRecoil-Setup-0.30.1.exe
          if gh release view v32 >/dev/null 2>&1; then
            gh release upload v32 dist/DeadRecoil-v32.apk dist/DeadRecoil-Setup-0.30.1.exe --clobber
            gh release edit v32 --title "Dead Recoil 0.30.1" --notes-file release/v32-notes.md --latest
          else
            gh release create v32 dist/DeadRecoil-v32.apk dist/DeadRecoil-Setup-0.30.1.exe \
              --target "$GITHUB_SHA" --title "Dead Recoil 0.30.1" --notes-file release/v32-notes.md --latest
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release view v32 --json tagName,name,isDraft,isPrerelease,assets
