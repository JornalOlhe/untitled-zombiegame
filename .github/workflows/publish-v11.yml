name: Publish Dead Recoil v11

on:
  workflow_dispatch:

concurrency:
  group: publish-v11
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeadRecoil-v11-UI
          path: test-results/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android QA
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verify Android QA package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='com.deadrecoil.game'"
          echo "$BADGING" | grep -q "versionCode='11'"
          echo "$BADGING" | grep -q "versionName='0.11.0'"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          source = Path("android/app/src/main/assets/index.html").read_bytes()
          apk_path = Path("android/app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(apk_path) as apk:
              packaged = apk.read("assets/index.html")
          if source != packaged:
              raise SystemExit("Packaged game assets do not match current main.")
          print("Android v11 QA verified.")
          PY
          mkdir -p dist
          cp "$APK" dist/DeadRecoil-v11-QA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v11-Android-QA
          path: dist/DeadRecoil-v11-QA.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate version
        shell: pwsh
        run: |
          $package = Get-Content desktop/package.json | ConvertFrom-Json
          if ($package.version -ne "0.11.0") { throw "Expected desktop 0.11.0" }

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Smoke test
        working-directory: desktop
        run: npm run smoke

      - name: Build Windows portable
        working-directory: desktop
        run: npm run dist

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "desktop/dist/DeadRecoil-Windows.exe"
          if (!(Test-Path $exe)) { throw "DeadRecoil-Windows.exe was not generated" }
          if ((Get-Item $exe).Length -lt 50000000) { throw "Generated executable is unexpectedly small" }

      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v11-Windows
          path: desktop/dist/DeadRecoil-Windows.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [ui-test, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v11-Android-QA
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v11-Windows
          path: dist

      - name: Publish GitHub pre-release v11
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/DeadRecoil-v11-QA.apk
          test -f dist/DeadRecoil-Windows.exe

          if gh release view v11 >/dev/null 2>&1; then
            gh release upload v11 dist/DeadRecoil-v11-QA.apk dist/DeadRecoil-Windows.exe --clobber
            gh release edit v11 \
              --title "Dead Recoil 0.11.0 QA" \
              --notes-file release/v11-notes.md \
              --prerelease
          else
            gh release create v11 \
              dist/DeadRecoil-v11-QA.apk \
              dist/DeadRecoil-Windows.exe \
              --target "$GITHUB_SHA" \
              --title "Dead Recoil 0.11.0 QA" \
              --notes-file release/v11-notes.md \
              --prerelease
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release view v11 --json tagName,name,isDraft,isPrerelease,assets
