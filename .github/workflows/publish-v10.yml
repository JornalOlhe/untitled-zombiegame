name: Publish Dead Recoil v10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v10.yml'

concurrency:
  group: publish-v10
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: 549ed3110e7ecd6cbf4c1eeb8b06a7e038d5f9f0c5dc657fc03f97f8d987f1ea
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Require release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Build Android release
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/deadrecoil-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/deadrecoil-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Sign Android release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/deadrecoil-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out dist/DeadRecoil.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify Android package
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/DeadRecoil.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt

          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -n1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          test "$CERT" = "$EXPECTED_CERT_SHA256"

          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='com.deadrecoil.game'"
          echo "$BADGING" | grep -q "versionCode='10'"
          echo "$BADGING" | grep -q "versionName='0.10.0'"

          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          source = Path("android/app/src/main/assets/index.html").read_bytes()
          with zipfile.ZipFile("dist/DeadRecoil.apk") as apk:
              packaged = apk.read("assets/index.html")
          if source != packaged:
              raise SystemExit("Packaged game assets do not match current main.")
          print("Android v10 verified.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v10-Android
          path: dist/DeadRecoil.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate version
        shell: pwsh
        run: |
          $package = Get-Content desktop/package.json | ConvertFrom-Json
          if ($package.version -ne "0.10.0") { throw "Expected desktop 0.10.0" }

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Smoke test
        working-directory: desktop
        run: npm run smoke

      - name: Build Windows portable
        working-directory: desktop
        run: npm run dist

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "desktop/dist/DeadRecoil-Windows.exe"
          if (!(Test-Path $exe)) { throw "DeadRecoil-Windows.exe was not generated" }
          if ((Get-Item $exe).Length -lt 50000000) { throw "Generated executable is unexpectedly small" }

      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v10-Windows
          path: desktop/dist/DeadRecoil-Windows.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v10-Android
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v10-Windows
          path: dist

      - name: Publish GitHub release v10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/DeadRecoil.apk
          test -f dist/DeadRecoil-Windows.exe

          if gh release view v10 >/dev/null 2>&1; then
            gh release upload v10 dist/DeadRecoil.apk dist/DeadRecoil-Windows.exe --clobber
            gh release edit v10 \
              --title "Dead Recoil 0.10.0" \
              --notes-file release/v10-notes.md \
              --latest
          else
            gh release create v10 \
              dist/DeadRecoil.apk \
              dist/DeadRecoil-Windows.exe \
              --target "$GITHUB_SHA" \
              --title "Dead Recoil 0.10.0" \
              --notes-file release/v10-notes.md \
              --latest
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v10 --json tagName,name,isDraft,isPrerelease,assets
