name: Publish Dead Recoil 0.31.3 (tag v36)
# v36: boot/crash hotfix + physical spear state + work branch production pass.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v36.yml']

concurrency:
  group: publish-v36
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node tests/js-syntax.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Core gameplay regressions
        run: |
          node tests/ui-smoke.cjs
          node tests/pursuit-smoke.cjs
          node tests/movement-smoke.cjs
          node tests/economy-collision-smoke.cjs
          node tests/weapons-smoke.cjs
          node tests/secret-smoke.cjs
          node tests/projectiles-smoke.cjs
          node tests/wall-smoke.cjs
          node tests/stream-hitbox-smoke.cjs
          node tests/dev-sandbox-smoke.cjs
          node tests/melee-smoke.cjs
          node tests/tp-smoke.cjs
          node tests/spear-smoke.cjs
          node tests/specter-smoke.cjs
          node tests/ceiling-smoke.cjs
          node tests/spawn-smoke.cjs
          node tests/devmode-smoke.cjs
          node tests/boss-audio-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeadRecoil-v36-UI
          path: test-results/
          retention-days: 15

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            gradle assembleRelease --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
      - name: Package and verify Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/35.0.0"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --out dist/DeadRecoil.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
            cp dist/DeadRecoil.apk dist/DeadRecoil-v36.apk
            APK="dist/DeadRecoil.apk"
            echo "Stable release-signed APK prepared."
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/DeadRecoil-v36-manual.apk
            APK="dist/DeadRecoil-v36-manual.apk"
            echo "::warning::Signing secrets are missing. Publishing manual-install APK only; updater will not auto-install it."
          fi
          export ANDROID_APK="$APK"
          echo "ANDROID_APK=$APK" >> "$GITHUB_ENV"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          BADGING=$("$BT/aapt" dump badging "$ANDROID_APK")
          echo "$BADGING" | grep -q "package: name='com.deadrecoil.game'"
          echo "$BADGING" | grep -q "versionCode='36'"
          echo "$BADGING" | grep -q "versionName='0.31.3'"
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          apk = Path(os.environ["ANDROID_APK"])
          source = Path("android/app/src/main/assets/index.html").read_bytes()
          with zipfile.ZipFile(apk) as z:
              packaged = z.read("assets/index.html")
          if source != packaged:
              raise SystemExit("Packaged game assets do not match current main.")
          print("Android package contents verified.")
          PY
      - name: Android real boot smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb logcat -c
            adb install -r "$ANDROID_APK"
            adb shell am force-stop com.deadrecoil.game
            adb shell am start -W -n com.deadrecoil.game/.MainActivity
            ok=0
            for i in $(seq 1 40); do
              if adb logcat -d -s DeadRecoil:I DeadRecoil:E '*:S' | grep -q "DEAD_RECOIL_READY 0.31.3"; then
                ok=1
                break
              fi
              if adb logcat -d | grep -qE "FATAL EXCEPTION.*com.deadrecoil.game|Process: com.deadrecoil.game.*FATAL"; then
                adb logcat -d | tail -300
                exit 1
              fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              echo "Game never emitted DEAD_RECOIL_READY."
              adb shell pidof com.deadrecoil.game || true
              adb logcat -d | tail -400
              exit 1
            fi
            adb shell pidof com.deadrecoil.game
            adb exec-out screencap -p > android-boot-v36.png
      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v36-Android
          path: |
            dist/*.apk
            android-boot-v36.png
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version
        shell: pwsh
        run: |
          $package = Get-Content desktop/package.json | ConvertFrom-Json
          if ($package.version -ne "0.31.3") { throw "Expected desktop 0.31.3" }
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Smoke test
        working-directory: desktop
        run: npm run smoke
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - name: Verify installer
        shell: pwsh
        run: |
          $exe = "desktop/dist/DeadRecoil-Setup-0.31.3.exe"
          if (!(Test-Path $exe)) { throw "Installer was not generated" }
          if ((Get-Item $exe).Length -lt 50000000) { throw "Installer is unexpectedly small" }
          $p = Start-Process $exe -ArgumentList "/S" -PassThru -Wait
          $installed = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Filter "Dead Recoil.exe" -Recurse -Depth 2 | Select-Object -First 1 -ExpandProperty FullName
          if (!$installed) { throw "Silent install did not produce Dead Recoil.exe" }
          $smoke = Start-Process $installed -ArgumentList "--smoke-test" -PassThru -Wait
          if ($smoke.ExitCode -ne 0) { throw "Installed game failed smoke test" }
          Get-FileHash $exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-v36-Windows
          path: desktop/dist/DeadRecoil-Setup-0.31.3.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [ui-test, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v36-Android
          path: android-artifact
      - uses: actions/download-artifact@v4
        with:
          name: DeadRecoil-v36-Windows
          path: windows-artifact
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find android-artifact -type f -name '*.apk' -exec cp {} dist/ \;
          find windows-artifact -type f -name '*.exe' -exec cp {} dist/ \;
          ls -lh dist
      - name: Publish GitHub release v36
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)"
          test -f dist/DeadRecoil-Setup-0.31.3.exe
          if gh release view v36 >/dev/null 2>&1; then
            gh release upload v36 dist/*.apk dist/DeadRecoil-Setup-0.31.3.exe --clobber
            gh release edit v36 --title "Dead Recoil 0.31.3" --notes-file release/v36-notes.md --latest
          else
            gh release create v36 dist/*.apk dist/DeadRecoil-Setup-0.31.3.exe \
              --target "$GITHUB_SHA" --title "Dead Recoil 0.31.3" --notes-file release/v36-notes.md --latest
          fi
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v36 --json tagName,name,isDraft,isPrerelease,assets
