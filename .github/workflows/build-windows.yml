name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Validate desktop version
        shell: pwsh
        run: |
          $package = Get-Content desktop/package.json | ConvertFrom-Json
          $gradle = Get-Content android/app/build.gradle -Raw
          $match = [regex]::Match($gradle, "versionName\s+'([^']+)'")
          if (!$match.Success) { throw "Could not read Android versionName" }
          $androidVersion = $match.Groups[1].Value
          if ($package.version -ne $androidVersion) {
            throw "desktop/package.json version must match Android source version ($androidVersion)"
          }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Smoke test desktop runtime
        working-directory: desktop
        run: npm run smoke

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop/dist" -Filter "DeadRecoil-Setup-*.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (!$exe) { throw "DeadRecoil-Setup installer was not generated" }
          $size = (Get-Item $exe).Length
          if ($size -lt 50000000) { throw "Generated executable is unexpectedly small: $size bytes" }
          Get-FileHash $exe -Algorithm SHA256

      - name: Check stable release source alignment
        id: release_alignment
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import sys, zipfile
          from pathlib import Path
          source = Path("android/app/src/main/assets/index.html").read_bytes()
          with zipfile.ZipFile("release/DeadRecoil.apk") as apk:
              packaged = apk.read("assets/index.html")
          if source != packaged:
              print("Main contains QA changes newer than the stable signed APK.")
              sys.exit(1)
          print("Stable APK source matches current main.")
          '@ | python -

      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-Windows-QA
          path: desktop/dist/DeadRecoil-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to current release
        if: steps.release_alignment.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content release/manifest.json | ConvertFrom-Json
          $tag = "v$($manifest.version_code)"
          $found = $false

          for ($attempt = 1; $attempt -le 18; $attempt++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              $found = $true
              break
            }
            Write-Host "Release $tag not available yet; retry $attempt/18"
            Start-Sleep -Seconds 10
          }

          if (!$found) { throw "Release $tag was not found" }

          $exe = Get-ChildItem "desktop/dist" -Filter "DeadRecoil-Setup-*.exe" | Select-Object -First 1 -ExpandProperty FullName
          gh release upload $tag "$exe" --clobber
