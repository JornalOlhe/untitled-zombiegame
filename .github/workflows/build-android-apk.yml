name: Build, test and publish Android

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-screenshots
          path: test-results/
          retention-days: 14

  build-apk:
    runs-on: ubuntu-latest
    outputs:
      signed_release: ${{ steps.signed_release.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile source
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Validate signed release package
        id: signed_release
        continue-on-error: true
        run: python3 tests/verify-release.py
      - name: Prepare QA APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/DeadRecoil-Android-QA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeadRecoil-Android-QA
          path: dist/DeadRecoil-Android-QA.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.signed_release.outcome == 'success'
        with:
          name: DeadRecoil-signed-APK
          path: release/DeadRecoil.apk
          retention-days: 30

  publish:
    needs: [ui-test, build-apk]
    if: needs.build-apk.outputs.signed_release == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["version_code"])')
          NAME=$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["version_name"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version v$VERSION already published; increase version and supply a newly signed APK for the next update."
          else
            gh release create "v$VERSION" release/DeadRecoil.apk --target "$GITHUB_SHA" --title "Dead Recoil $NAME" --notes-file release/notes.md --latest
          fi
