name: Gameplay QA

on:
  push:
    branches: [work, main]
    paths:
      - 'android/app/src/main/assets/index.html'
      - 'tests/**'
      - '.github/workflows/work-qa.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: UI, syntax and menu state
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and v43 contracts
        run: |
          node tests/js-syntax.cjs
          node tests/v43-contract-smoke.cjs
          node tests/story-modes-smoke.cjs
          node tests/survivor-skin-smoke.cjs
          node tests/gamepad-smoke.cjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: UI and menu state
        run: |
          node tests/ui-smoke.cjs
          node tests/showroom-gameplay-smoke.cjs
          node tests/wallet-reconciliation-smoke.cjs
          node tests/release-version.cjs
          node tests/navigation-race.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-ui-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15

  movement:
    name: Movement, collision and spawning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Movement, collision and spawning
        run: |
          node tests/movement-smoke.cjs
          node tests/economy-collision-smoke.cjs
          node tests/wall-smoke.cjs
          node tests/ceiling-smoke.cjs
          node tests/spawn-smoke.cjs
          node tests/pursuit-smoke.cjs
          node tests/replayability-smoke.cjs
          node tests/resource-cycle.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-movement-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15

  combat:
    name: Combat, weapons and projectiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Combat, weapons and projectiles
        run: |
          node tests/melee-smoke.cjs
          node tests/spear-smoke.cjs
          node tests/tp-smoke.cjs
          node tests/rig-visual-audit.cjs
          node tests/weapons-smoke.cjs
          node tests/projectiles-smoke.cjs
          node tests/stream-hitbox-smoke.cjs
          node tests/barrel-weapons-smoke.cjs
          node tests/cyborg-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-combat-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15

  visuals:
    name: Bosses, secrets and visual systems
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONSTER_SHOTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Bosses, secrets and visual systems
        run: |
          node tests/monsters-smoke.cjs
          node tests/boss-audio-smoke.cjs
          node tests/intro-smoke.cjs
          node tests/deathkill-smoke.cjs
          node tests/ascend-smoke.cjs
          node tests/secret-smoke.cjs
          node tests/specter-smoke.cjs
          node tests/wings-tail-smoke.cjs
          node tests/dof-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-visuals-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15

  multiplayer:
    name: Multiplayer and developer safety
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Multiplayer and developer safety
        run: |
          node tests/multiplayer-local.cjs
          node tests/devmode-smoke.cjs
          node tests/dev-sandbox-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-multiplayer-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15
