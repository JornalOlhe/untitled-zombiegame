name: Gameplay QA

on:
  push:
    branches: [work, main]
    paths:
      - 'android/app/src/main/assets/index.html'
      - 'tests/**'
      - '.github/workflows/work-qa.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: UI, syntax and menu state
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and v43 contracts
        run: |
          bash tools/ci/run-tests.sh tests/js-syntax.cjs tests/v43-contract-smoke.cjs tests/story-modes-smoke.cjs tests/environment-detail-smoke.cjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: UI and menu state
        run: |
          bash tools/ci/run-tests.sh tests/ui-smoke.cjs tests/showroom-gameplay-smoke.cjs tests/wallet-reconciliation-smoke.cjs tests/release-version.cjs tests/navigation-race.cjs tests/survivor-skin-smoke.cjs tests/v53-survivor-reference-lock.cjs tests/gamepad-smoke.cjs tests/puddles-smoke.cjs tests/powerups-smoke.cjs tests/hitdir-smoke.cjs tests/director-smoke.cjs tests/explosion-smoke.cjs tests/settings-hud-smoke.cjs tests/floor-gloss-smoke.cjs tests/wallcast-smoke.cjs tests/weather-smoke.cjs tests/hitbox-smoke.cjs tests/balance-smoke.cjs tests/loadout-locks-smoke.cjs tests/camera-feel-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-ui-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15

  movement:
    name: Movement, collision and spawning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Movement, collision and spawning
        run: |
          bash tools/ci/run-tests.sh tests/movement-smoke.cjs tests/economy-collision-smoke.cjs tests/wall-smoke.cjs tests/ceiling-smoke.cjs tests/spawn-smoke.cjs tests/pursuit-smoke.cjs tests/replayability-smoke.cjs tests/resource-cycle.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-movement-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15

  combat:
    name: Combat, weapons and projectiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Combat, weapons and projectiles
        run: |
          bash tools/ci/run-tests.sh tests/melee-smoke.cjs tests/spear-smoke.cjs tests/tp-smoke.cjs tests/rig-visual-audit.cjs tests/weapons-smoke.cjs tests/projectiles-smoke.cjs tests/stream-hitbox-smoke.cjs tests/barrel-weapons-smoke.cjs tests/cyborg-smoke.cjs tests/match-shop-smoke.cjs tests/v57-features-smoke.cjs tests/v58-ammo-balance-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-combat-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15

  visuals:
    name: Bosses, secrets and visual systems
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONSTER_SHOTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Bosses, secrets and visual systems
        run: |
          bash tools/ci/run-tests.sh tests/monsters-smoke.cjs tests/boss-audio-smoke.cjs tests/intro-smoke.cjs tests/deathkill-smoke.cjs tests/ascend-smoke.cjs tests/secret-smoke.cjs tests/specter-smoke.cjs tests/wings-tail-smoke.cjs tests/dof-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-visuals-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15

  multiplayer:
    name: Multiplayer and developer safety
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Multiplayer and developer safety
        run: |
          bash tools/ci/run-tests.sh tests/multiplayer-local.cjs tests/devmode-smoke.cjs tests/dev-sandbox-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-qa-multiplayer-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 15
