name: Apply v49 wallet hotfix

on:
  push:
    branches: [main]
    paths:
      - 'release/v49-hotfix-trigger.txt'

concurrency:
  group: v49-wallet-hotfix
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch authoritative final wallet and prepare v49
        run: python3 tools/v49-hotfix.py

      - name: Static syntax gate
        run: |
          node tests/js-syntax.cjs
          node tests/story-modes-smoke.cjs
          node tests/v48-survivor-smoke.cjs

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/v49-hotfix-trigger.txt
          git config user.name "Dead Recoil Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/assets/index.html tests/wallet-reconciliation-smoke.cjs android/app/build.gradle desktop/package.json .github/workflows/publish-v49.yml release/v49-notes.md release/v49-hotfix-trigger.txt
          git diff --cached --check
          git commit -m "fix: settle final wallet and prepare v49"
          git push origin HEAD:main
