name: JavaScript syntax check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/assets/index.html'
      - 'tests/js-syntax.cjs'
      - '.github/workflows/js-syntax.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/js-syntax.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: js-syntax-failure
          path: test-results/
