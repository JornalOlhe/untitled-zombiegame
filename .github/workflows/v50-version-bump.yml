name: Prepare Dead Recoil v50

on:
  push:
    branches: [main]
    paths:
      - 'release/v50-prepare.txt'

permissions:
  contents: write

concurrency:
  group: prepare-v50
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump runtime and package versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          index = Path("android/app/src/main/assets/index.html")
          text = index.read_text(encoding="utf-8")
          old = 'const GAME_VERSION = "0.44.0";'
          new = 'const GAME_VERSION = "0.45.0";'
          if text.count(old) != 1:
              raise SystemExit(f"GAME_VERSION anchor count={text.count(old)}")
          index.write_text(text.replace(old, new, 1), encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")
          if g.count("versionCode 49") != 1 or g.count("versionName '0.44.0'") != 1:
              raise SystemExit("Android v49 version anchors are not unique")
          g = g.replace("versionCode 49", "versionCode 50", 1)
          g = g.replace("versionName '0.44.0'", "versionName '0.45.0'", 1)
          gradle.write_text(g, encoding="utf-8")

          pkg = Path("desktop/package.json")
          data = json.loads(pkg.read_text(encoding="utf-8"))
          if data.get("version") != "0.44.0":
              raise SystemExit(f"Desktop version was {data.get('version')!r}, expected 0.44.0")
          data["version"] = "0.45.0"
          pkg.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          node tests/release-version.cjs
          node tests/story-modes-smoke.cjs
          node tests/v48-survivor-smoke.cjs
          node tests/wallet-reconciliation-smoke.cjs
      - name: Commit release-ready source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Dead Recoil v50 / 0.45.0 ready after Story/modes/survivor consolidation and release-version checks.' > release/v50-ready.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/assets/index.html android/app/build.gradle desktop/package.json release/v50-ready.txt
          git commit -m "release: prepare v50 0.45.0"
          git push origin HEAD:main
